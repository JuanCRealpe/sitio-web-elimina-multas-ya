<div class="min-vh-100 bg-dark py-5">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-lg border-0 border-top border-success border-4 rounded-4 bg-success-subtle">
                    <div class="card-body p-4 p-md-5">
                        <h2 class="text-center mb-4 text-success fw-bold">
                            Iniciar Sesión
                        </h2>

                        <form
                            [formGroup]="form"
                            (ngSubmit)="iniciarSesion()"
                        >
                            <div class="mb-3">
                                <label class="form-label fw-semibold text-dark">
                                    Email
                                </label>
                                <input 
                                    type="email"
                                    class="form-control border-success-subtle"
                                    formControlName="email"
                                >
                                <small
                                    class="text-danger"
                                    *ngIf="
                                        form.get('email')?.touched &&
                                        form.get('email')?.invalid
                                    "
                                >
                                    El email es invalido
                                </small>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold text-dark">
                                    Password
                                </label>
                                <input 
                                    type="password"
                                    class="form-control border-success-subtle"
                                    formControlName="password"
                                >
                                <small
                                    class="text-danger"
                                    *ngIf="
                                        form.get('password')?.touched &&
                                        form.get('password')?.invalid
                                    "
                                >
                                    El password debe tener minimo 6 caracteres
                                </small>
                            </div>
                            <button
                                class="btn btn-success w-100 fw-semibold shadow-sm"
                                [disabled]="cargando"
                            >
                                {{ cargando ? 'Ingresando...' : 'Iniciar Sesión' }}
                            </button>
                        </form>
                        <p class="text-center mt-3">
                            ¿No tienes una cuenta?
                            <a routerLink="/register">
                                Registrate
                            </a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
