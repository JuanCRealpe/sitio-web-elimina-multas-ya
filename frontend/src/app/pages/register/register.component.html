<div class="min-vh-100 bg-dark py-5">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-lg border-0 border-top border-success border-4 rounded-4 bg-success-subtle">
                    <div class="card-body p-4 p-md-5">
                        <h2 class="text-center mb-4 text-success fw-bold">
                            Registro
                        </h2>

                        <form
                            [formGroup]="form"
                            (ngSubmit)="registrar()"
                        >
                            <div class="mb-3">
                                <label class="form-label fw-semibold text-dark">
                                    Nombre
                                </label>
                                <input 
                                    type="text"
                                    class="form-control border-success-subtle"
                                    formControlName="nombre"
                                >
                                <small
                                    class="text-danger"
                                    *ngIf="
                                        form.get('nombre')?.touched &&
                                        form.get('nombre')?.invalid
                                    "
                                >
                                    El nombre es requerido y debe tener minimo 3 caracteres
                                </small>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold text-dark">
                                    Email
                                </label>
                                <input 
                                    type="email"
                                    class="form-control border-success-subtle"
                                    formControlName="email"
                                >
                                <small
                                    class="text-danger"
                                    *ngIf="
                                        form.get('email')?.touched &&
                                        form.get('email')?.invalid
                                    "
                                >
                                    El email es invalido
                                </small>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold text-dark">
                                    Edad
                                </label>
                                <input 
                                    type="number"
                                    class="form-control border-success-subtle"
                                    formControlName="edad"
                                >
                                <small
                                    class="text-danger"
                                    *ngIf="
                                        form.get('edad')?.touched &&
                                        form.get('edad')?.invalid
                                    "
                                >
                                    la edad es invalida
                                </small>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold text-dark">
                                    Password
                                </label>
                                <div class="position-relative">
                                    <input 
                                        [type]="mostrarPassword ? 'text' : 'password'"
                                        class="form-control border-success-subtle"
                                        formControlName="password"
                                    >
                                    <i 
                                        class="bi position-absolute top-50 end-0 translate-middle-y me-3"
                                        [class.bi-eye-fill]="!mostrarPassword"
                                        [class.bi-eye-slash-fill]="mostrarPassword"
                                        style="cursor: pointer;"
                                        (click)="togglePassword()"
                                    ></i>
                                </div>
                                <small
                                    class="text-danger"
                                    *ngIf="
                                        form.get('password')?.touched &&
                                        form.get('password')?.invalid
                                    "
                                >
                                    El password debe tener minimo 6 caracteres
                                </small>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold text-dark">
                                    Confirmar Password
                                </label>
                                <div class="position-relative">
                                    <input 
                                        [type]="mostrarConfirmPassword ? 'text' : 'password'"
                                        class="form-control border-success-subtle"
                                        formControlName="confirmPassword"
                                    >
                                    <i 
                                        class="bi position-absolute top-50 end-0 translate-middle-y me-3"
                                        [class.bi-eye-fill]="!mostrarConfirmPassword"
                                        [class.bi-eye-slash-fill]="mostrarConfirmPassword"
                                        style="cursor: pointer;"
                                        (click)="toggleConfirmPassword()"
                                    ></i>
                                </div>
                                <small
                                    class="text-danger"
                                    *ngIf="
                                        form.get('confirmPassword')?.touched &&
                                        form.hasError('passwordsNoCoinciden')
                                    "
                                >
                                    Las contraseñas no coinciden
                                </small>
                            </div>
                            <button
                                class="btn btn-success w-100 fw-semibold shadow-sm"
                                [disabled]="cargando"
                            >
                                {{ cargando ? 'Registrando...' : ' Registrarse' }}
                            </button>
                        </form>
                        <p class="text-center mt-3">
                            ¿Ya tienes una cuenta?
                            <a routerLink="/login">
                                Iniciar sesion
                            </a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
